name: Update Wiki Role Stats

# custom_role_pile 有更新时自动重建 wiki 统计页；也支持在 Actions 页面手动触发。
on:
  push:
    paths:
      - 'custom_role_pile/**'
      - '.github/workflows/update-wiki-stats.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'ww.nanoka.cc 数据版本（留空自动探测）'
        required: false
        default: ''
      override:
        description: '人工指定性别，格式 ID=男/女（多个用逗号分隔，如 1512=女）'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: wiki-role-stats
  cancel-in-progress: true

jobs:
  update-wiki:
    runs-on: ubuntu-latest
    steps:
      # wiki 是独立仓库，GITHUB_TOKEN 没有它的写权限；且 fine-grained PAT 的仓库
      # 选择列表里不含 <repo>.wiki（选了也 403），所以必须用 classic PAT。
      # 没配就立刻失败并提示，避免 checkout/push 阶段报难懂的错误或静默不推。
      - name: Verify WIKI_TOKEN
        shell: bash
        env:
          WIKI_TOKEN: ${{ secrets.WIKI_TOKEN }}
        run: |
          if [ -z "$WIKI_TOKEN" ]; then
            echo "::error::缺少 WIKI_TOKEN，无法推送 wiki 仓库。"
            echo "请到 Settings → Secrets and variables → Actions → New repository secret"
            echo "新建名为 WIKI_TOKEN 的 secret，值填 classic PAT（勾选 public_repo）。"
            exit 1
          fi

      - name: Checkout resources
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Checkout wiki
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}.wiki
          path: wiki
          # classic PAT，classic 的 public_repo scope 覆盖 .wiki 仓库；
          # 在 Settings → Secrets and variables → Actions 新建 secret：WIKI_TOKEN
          token: ${{ secrets.WIKI_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate stats page
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          OVERRIDE: ${{ inputs.override }}
        run: |
          args=(--pile custom_role_pile --wiki wiki)
          if [ -n "$VERSION" ]; then args+=(--version "$VERSION"); fi
          if [ -n "$OVERRIDE" ]; then
            IFS=',' read -ra pairs <<< "$OVERRIDE"
            for p in "${pairs[@]}"; do
              [ -n "$p" ] && args+=(--override "$p")
            done
          fi
          python wiki/scripts/update_stats.py "${args[@]}"

      - name: Commit and push wiki
        working-directory: wiki
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -z "$(git status --porcelain)" ]; then
            echo "统计页无变化，跳过提交"
            exit 0
          fi
          git add -A
          git commit -m "chore: 更新角色资源统计（${GITHUB_SHA::7}）"
          git push
